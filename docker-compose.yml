services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./prisma:/app/prisma
    environment:
      DATABASE_URL: file:./dev.db
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    restart: unless-stopped
